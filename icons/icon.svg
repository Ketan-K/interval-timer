<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Squircle / Rounded Background -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  
  <!-- Outer Inactive Ring Track -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#292e3a" stroke-width="24"/>
  
  <!-- Active Blue Countdown Progress Ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#ringGrad)" stroke-width="24"
          stroke-linecap="round" stroke-dasharray="1005.3" stroke-dashoffset="250"
          transform="rotate(-90 256 256)" filter="url(#glow)"/>

  <!-- 4 Cardinal Dots -->
  <circle cx="256" cy="72" r="8" fill="#60a5fa"/>
  <circle cx="440" cy="256" r="8" fill="#434854"/>
  <circle cx="256" cy="440" r="8" fill="#434854"/>
  <circle cx="72" cy="256" r="8" fill="#434854"/>

  <!-- Timer Hands / Center Icon Glyph -->
  <!-- Top button knob -->
  <rect x="236" y="128" width="40" height="16" rx="8" fill="#3b82f6"/>
  <!-- Center dot -->
  <circle cx="256" cy="256" r="18" fill="#ffffff"/>
  <!-- Minute hand -->
  <line x1="256" y1="256" x2="256" y2="175" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <!-- Second hand (accent blue) -->
  <line x1="256" y1="256" x2="320" y2="256" stroke="#60a5fa" stroke-width="8" stroke-linecap="round"/>
</svg>
