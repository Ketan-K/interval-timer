<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e222b"/>
      <stop offset="100%" stop-color="#121419"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
  </defs>

  <!-- Full Bleed Background for Safe Area (Maskable) -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  
  <!-- Safe Zone Circle Track (within 80% safe zone radius ~130) -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="#292e3a" stroke-width="20"/>
  
  <!-- Active Blue Progress Ring -->
  <circle cx="256" cy="256" r="130" fill="none" stroke="url(#ringGrad)" stroke-width="20"
          stroke-linecap="round" stroke-dasharray="816.8" stroke-dashoffset="204"
          transform="rotate(-90 256 256)"/>

  <!-- Cardinal Reference Dots -->
  <circle cx="256" cy="106" r="7" fill="#60a5fa"/>
  <circle cx="406" cy="256" r="7" fill="#434854"/>
  <circle cx="256" cy="406" r="7" fill="#434854"/>
  <circle cx="106" cy="256" r="7" fill="#434854"/>

  <!-- Center Hands -->
  <circle cx="256" cy="256" r="14" fill="#ffffff"/>
  <line x1="256" y1="256" x2="256" y2="185" stroke="#ffffff" stroke-width="10" stroke-linecap="round"/>
  <line x1="256" y1="256" x2="310" y2="256" stroke="#60a5fa" stroke-width="7" stroke-linecap="round"/>
</svg>
